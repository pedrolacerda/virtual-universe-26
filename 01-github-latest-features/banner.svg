<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" aria-label="Section 1: The Modern GitHub Experience" role="img" viewBox="0 0 1280 480"><style>.s{font-family:&quot;Mona Sans&quot;,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.m{font-family:&quot;Monaspace Neon&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="none" stroke="#e3e5e0" d="M24 0H0V24"/></pattern><filter id="sh" width="110%" height="120%" x="-5%" y="-5%"><feDropShadow dx="0" dy="6" flood-color="#1f2328" flood-opacity=".08" stdDeviation="10"/></filter><clipPath id="c1"><rect width="580" height="156" x="640" y="44" rx="12"/></clipPath><clipPath id="c2"><rect width="580" height="218" x="600" y="226" rx="12"/></clipPath></defs><rect width="1280" height="480" fill="#f3f4f1"/><rect width="1280" height="480" fill="url(#grid)"/><text x="56" y="120" fill="#59636e" class="m" font-size="15" letter-spacing="3">SECTION 1 · 2 TUTORIALS</text><text x="56" y="198" fill="#0d0d0d" class="s" font-size="52" font-weight="600" letter-spacing="-1.3">The Modern</text><text x="56" y="260" fill="#0d0d0d" class="s" font-size="52" font-weight="600" letter-spacing="-1.3">GitHub Experience</text><rect width="64" height="4" x="56" y="298" fill="#1f883d"/><text x="56" y="350" fill="#59636e" class="s" font-size="24">Five-minute tutorials with</text><text x="56" y="384" fill="#59636e" class="s" font-size="24">the GitHub CLI.</text><g filter="url(#sh)"><rect width="580" height="156" x="640" y="44" fill="#0d1117" rx="12"/></g><g clip-path="url(#c1)"><rect width="7" height="156" x="640" y="44" fill="#1f883d"/></g><circle cx="672" cy="68" r="5" fill="#ff7b72"/><circle cx="690" cy="68" r="5" fill="#d29922"/><circle cx="708" cy="68" r="5" fill="#3fb950"/><text x="672" y="106" fill="#e6edf3" class="m" font-size="16"><tspan fill="#3fb950">$</tspan> gh auth login <tspan fill="#ffa657">--web</tspan></text><text x="672" y="132" fill="#8b949e" class="m" font-size="14">✓ Logged in as you</text><text x="672" y="162" fill="#e6edf3" class="m" font-size="16"><tspan fill="#3fb950">$</tspan> gh repo fork <tspan fill="#ffa657">--remote</tspan></text><text x="672" y="186" fill="#8b949e" class="m" font-size="14">✓ Created fork you/virtual-universe-26</text><g filter="url(#sh)"><rect width="580" height="218" x="600" y="226" fill="#fff" rx="12"/></g><g clip-path="url(#c2)"><rect width="7" height="218" x="600" y="226" fill="#1f883d"/></g><text x="632" y="264" fill="#59636e" class="s" font-size="13" font-weight="600" letter-spacing="1">TUTORIALS</text><line x1="600" x2="1180" y1="280" y2="280" stroke="#d1d9e0"/><circle cx="650" cy="318" r="16" fill="#ddf4ff"/><text x="650" y="324" fill="#0969da" class="s" font-size="15" font-weight="600" text-anchor="middle">1</text><text x="682" y="314" fill="#1f2328" class="s" font-size="18" font-weight="600">Attach images to an issue</text><text x="682" y="336" fill="#59636e" class="m" font-size="13">gh issue create --attach</text><text x="1150" y="322" fill="#59636e" class="s" font-size="13" text-anchor="end">5 min</text><line x1="632" x2="1150" y1="358" y2="358" stroke="#eff2f5"/><circle cx="650" cy="398" r="16" fill="#ddf4ff"/><text x="650" y="404" fill="#0969da" class="s" font-size="15" font-weight="600" text-anchor="middle">2</text><text x="682" y="394" fill="#1f2328" class="s" font-size="18" font-weight="600">Create a stacked PR</text><text x="682" y="416" fill="#59636e" class="m" font-size="13">gh stack submit</text><text x="1150" y="402" fill="#59636e" class="s" font-size="13" text-anchor="end">5 min</text></svg>