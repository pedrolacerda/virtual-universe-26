="130" fill="#e6edf3" class="m" font-size="16">--title <tspan fill="#a5d6ff">&quot;Menu prices show $NaN&quot;</tspan> \</text><text x="668" y="154" fill="#e6edf3" class="m" font-size="16"><tspan fill="#ffa657">--attach</tspan> <tspan fill="#a5d6ff">&apos;menu-prices.png#Menu board…&apos;</tspan></text><text x="632" y="182" fill="#8b949e" class="m" font-size="14">https://github.com/you/virtual-universe-26/issues/7</text><g filter="url(#sh)"><rect width="620" height="218" x="560" y="226" fill="#fff" rx="12"/></g><g clip-path="url(#c2)"><rect width="7" height="218" x="560" y="226" fill="#1f883d"/></g><text x="592" y="266" fill="#1f2328" class="s" font-size="22">Menu prices show $NaN <tspan fill="#59636e">#7</tspan></text><rect width="70" height="26" x="592" y="282" fill="#1f883d" rx="13"/><circle cx="608" cy="295" r="5.5" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="608" cy="295" r="1.6" fill="#fff"/><text x="619" y="300" fill="#fff" class="s" font-size="13" font-weight="600">Open</text><line x1="560" x2="1180" y1="324" y2="324" stroke="#d1d9e0"/><text x="592" y="352" fill="#1f2328" class="s" font-size="15">Playwright caught this:</text><rect width="300" height="62" x="592" y="366" fill="#f6f8fa" stroke="#d1d9e0" rx="6"/><rect width="276" height="16" x="604" y="376" fill="#ffebe9" stroke="#ff8182" rx="3"/><text x="612" y="388" fill="#82071e" class="s" font-size="10">We couldn’t load prices for this menu</text><text x="606" y="414" fill="#1f2328" class="s" font-size="12">Espresso</text><text x="868" y="414" fill="#cf222e" class="m" font-size="12" text-anchor="end">$NaN</text><text x="910" y="384" fill="#59636e" class="s" font-size="13">menu-prices.png</text><text x="910" y="404" fill="#59636e" class="s" font-size="13">Menu board showing $NaN</text></svg>